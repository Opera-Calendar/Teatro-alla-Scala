name: Update La Scala subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scala-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Retrieve official La Scala information
        run: python scala_calendar.py --output site
      - name: Upload calendar website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy updated calendars
        id: deployment
        uses: actions/deploy-pages@v4
